name: Integration & System Test

on:
  push:
    branches: [main, dev]  # ✅ 监听dev分支
  workflow_dispatch:  # 手动触发

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Setup environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc g++
          pip install pytest
          
      - name: Build firmware
        run: |
          echo "Building firmware..."
          cd IoT_EnvMonitorSys_WIFI/firmware
          mkdir -p build && cd build
          cmake .. -DTARGET_PLATFORM=simulator
          make -j4
          echo "✅ Firmware built successfully"
          ls -la  # 查看生成的文件
          
      - name: Setup Python environment
        run: |
          # 安装cloud_services依赖
          cd IoT_EnvMonitorSys_WIFI/cloud_services
          pip install paho-mqtt scikit-learn
          
          # 安装test_engine依赖
          cd ../../test_engine
          pip install pytest pytest-html
          
          echo "✅ Python dependencies installed"

      