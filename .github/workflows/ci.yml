name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'test_engine/**'
      - 'IoT_EnvMonitorSys_WIFI/**'
      - '.github/workflows/integration.yml'
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点
    
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test Scope'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - firmware-e2e
          - cloud-e2e

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Build components if needed
        run: |
          echo "Building components for integration testing..."
          
          # 构建固件
          cd IoT_EnvMonitorSys_WIFI/firmware
          mkdir -p build && cd build
          cmake .. -DTARGET_PLATFORM=simulator
          make -j4
          
          # 构建云端
          cd ../../cloud_services
          npm ci
          npm run build
          
      - name: Setup test environment
        run: |
          cd test_engine
          pip install -e .
          
      - name: Run integration tests
        env:
          TEST_SCOPE: ${{ github.event.inputs.scope || 'full' }}
        
        run: |
          cd test_engine
          
          case "$TEST_SCOPE" in
            "quick")
              echo "Running quick smoke tests..."
              python -m pytest tests/smoke/ -v
              ;;
            "firmware-e2e")
              echo "Running firmware end-to-end tests..."
              python -m pytest tests/system/firmware/ -v
              ;;
            "cloud-e2e")
              echo "Running cloud end-to-end tests..."
              python -m pytest tests/system/cloud/ -v
              ;;
            *)
              echo "Running full integration tests..."
              python -m pytest tests/ -v --html=report.html
              ;;
          esac
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test_engine/report.html
            test_engine/test-results/
          retention-days: 30