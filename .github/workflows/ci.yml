name: Integration & System Test

on:
  push:
    branches: [main, dev]  # ✅ 监听dev分支
    paths:
      - 'IoT_EnvMonitorSys_WIFI/**'
      - 'test_engine/**'
      - '.github/workflows/ci.yml'
    
  pull_request:
    branches: [main, dev]
    paths:
      - 'test_engine/**'
      - 'IoT_EnvMonitorSys_WIFI/**'
  
  # 每天凌晨2点自动运行
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:  # 手动触发
    inputs:
      scope:
        description: 'Test Scope'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - firmware
          - cloud

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Setup environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc g++
          
          
      - name: Build firmware
        run: |
          echo "Building firmware..."
          cd IoT_EnvMonitorSys_WIFI/firmware
          mkdir -p build && cd build
          cmake .. -DTARGET_PLATFORM=simulator
          make -j4
          echo "✅ Firmware built successfully"
          ls -la  # 查看生成的文件
          
      - name: Setup Python environment
        run: |
          # 安装cloud_services依赖
          cd IoT_EnvMonitorSys_WIFI/cloud_services
          pip install pytest pytest-html
          pip install pytest pytest-html paho-mqtt scikit-learn
          
          # 安装test_engine依赖
          cd ../../test_engine
          pip install pytest pytest-html
          
          echo "✅ Python dependencies installed"


      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/IoT_EnvMonitorSys_WIFI/cloud_services:${{ github.workspace }}/IoT_EnvMonitorSys_WIFI/cloud_services/data_collector:${{ github.workspace }}/IoT_EnvMonitorSys_WIFI/cloud_services/shared
        run: |
          cd test_engine
          
          # 判断测试策略
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 PR检查：运行全面回归测试..."
            pytest tests/ -v --html=pr_full_report.html --cov=.
            
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "🌙 半夜系统测试：端到端验证..."
            pytest tests/ -v --html=system_report.html
            
          else
            echo "⚡ 日常推送：快速测试..."
            # 快速冒烟测试
            pytest tests/ -v --maxfail=3 --tb=short
          fi
          
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: test_engine/*_report.html
          retention-days: 30


          